<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.js FPS Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        user-select: none;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      /* Centered screen crosshair */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        pointer-events: none;
        user-select: none;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ch-dot {
        position: absolute;
        width: 3px;
        height: 3px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.85);
      }

      .ch-line {
        position: absolute;
        background-color: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.85);
      }

      .ch-top {
        width: 2px;
        height: 6px;
        top: 0;
        left: 9px;
      }

      .ch-bottom {
        width: 2px;
        height: 6px;
        bottom: 0;
        left: 9px;
      }

      .ch-left {
        width: 6px;
        height: 2px;
        left: 0;
        top: 9px;
      }

      .ch-right {
        width: 6px;
        height: 2px;
        right: 0;
        top: 9px;
      }

      /* Minimal Combat HUD */
      #hud {
        position: fixed;
        bottom: 28px;
        right: 36px;
        pointer-events: none;
        user-select: none;
        z-index: 1000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Liberation Sans", monospace, sans-serif;
      }

      #hud-ammo-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      #hud-status-text {
        min-height: 18px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 2px;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }

      .status-reloading {
        color: #fca311;
        animation: pulse-reload 0.8s ease-in-out infinite alternate;
      }

      .status-empty {
        color: #e63946;
      }

      @keyframes pulse-reload {
        from { opacity: 0.5; }
        to { opacity: 1.0; }
      }

      #hud-ammo-digits {
        display: flex;
        align-items: baseline;
        line-height: 1;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      #hud-ammo-current {
        font-size: 40px;
        font-weight: 800;
        color: #ffffff;
      }

      #hud-ammo-current.low-ammo {
        color: #fca311;
      }

      #hud-ammo-divider {
        font-size: 22px;
        color: rgba(255, 255, 255, 0.35);
        margin: 0 6px;
      }

      #hud-ammo-reserve {
        font-size: 20px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.65);
      }
    </style>
    <script type="module" crossorigin src="/assets/index-pXKlEhzW.js"></script>
  </head>
  <body>
    <div id="crosshair" aria-hidden="true">
      <div class="ch-dot"></div>
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-bottom"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-line ch-right"></div>
    </div>
    <div id="hud" aria-hidden="true">
      <div id="hud-ammo-box">
        <div id="hud-status-text"></div>
        <div id="hud-ammo-digits">
          <span id="hud-ammo-current">12</span>
          <span id="hud-ammo-divider">/</span>
          <span id="hud-ammo-reserve">60</span>
        </div>
      </div>
    </div>
    <canvas id="renderCanvas"></canvas>
  </body>
</html>
